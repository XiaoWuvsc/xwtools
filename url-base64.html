<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes"><title>URL/Base64 编解码 · xwtools</title><style>html,body{overflow-x:auto;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;background:transparent;display:none}*{margin:0;padding:0;box-sizing:border-box}:root{--bg-dark:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);--bg-light:linear-gradient(135deg,#f1f5f9 0%,#e2e8f0 100%);--card-bg-dark:rgba(15,23,42,0.7);--card-bg-light:rgba(255,255,255,0.85);--text-primary-dark:#e2e8f0;--text-primary-light:#0f172a;--text-secondary-dark:#94a3b8;--text-secondary-light:#334155;--border-color-dark:rgba(71,85,105,0.5);--border-color-light:rgba(0,0,0,0.1);--accent:#3b82f6;--input-bg-dark:rgba(0,0,0,0.2);--input-bg-light:rgba(0,0,0,0.03);--btn-bg-dark:rgba(59,130,246,0.2);--btn-bg-light:rgba(59,130,246,0.1);--btn-hover:#3b82f6;--copy-btn-bg-dark:rgba(0,0,0,0.5);--copy-btn-bg-light:rgba(0,0,0,0.1);--shadow:0 25px 40px -12px rgba(0,0,0,0.4)}body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding:2rem 1.5rem;position:relative;background:var(--bg-dark);transition:color .2s ease}.bg-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;transition:opacity 0.6s cubic-bezier(0.4,0,0.2,1)}.bg-dark{background:var(--bg-dark);opacity:1}.bg-light{background:var(--bg-light);opacity:0}body.light .bg-dark{opacity:0}body.light .bg-light{opacity:1}.container{max-width:1000px;margin:0 auto;position:relative;z-index:1}.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card-bg-dark);backdrop-filter:blur(16px);border-radius:2rem;padding:.6rem 1.2rem;margin-bottom:2rem;border:1px solid var(--border-color-dark);box-shadow:0 4px 12px rgba(0,0,0,.1);transition:background .3s,border .3s}body.light .top-bar{background:var(--card-bg-light);border-color:var(--border-color-light)}.nav-buttons{display:flex;gap:12px}.nav-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.15);padding:6px 14px;border-radius:40px;text-decoration:none;color:var(--text-secondary-dark);font-size:.85rem;font-weight:500;border:1px solid var(--border-color-dark);transition:all .2s ease;cursor:pointer}body.light .nav-btn{color:var(--text-secondary-light);border-color:var(--border-color-light)}.nav-btn:hover{background:var(--accent);color:#fff;transform:translateY(-1px)}.card{background:var(--card-bg-dark);backdrop-filter:blur(16px);border-radius:2rem;border:1px solid var(--border-color-dark);padding:2rem;margin-bottom:1.5rem;box-shadow:var(--shadow);transition:background .3s,border .3s;position:relative;overflow:hidden}body.light .card{background:var(--card-bg-light);border-color:var(--border-color-light)}.card h2{font-size:1.5rem;margin-bottom:1rem;color:var(--accent)}.card textarea{width:100%;background:var(--input-bg-dark);border:1px solid var(--border-color-dark);border-radius:1rem;padding:.8rem;color:var(--text-primary-dark);font-family:monospace;font-size:.9rem;resize:vertical;transition:background .3s,border .3s,color .3s}body.light .card textarea{background:var(--input-bg-light);border-color:var(--border-color-light);color:var(--text-primary-light)}.card textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.2)}.btn-group{display:flex;gap:.5rem;margin:.8rem 0;flex-wrap:wrap}.card button{background:var(--btn-bg-dark);border:1px solid var(--border-color-dark);padding:.5rem 1rem;border-radius:2rem;color:var(--text-primary-dark);cursor:pointer;transition:all .2s ease;font-size:.85rem}body.light .card button{background:var(--btn-bg-light);border-color:var(--border-color-light);color:var(--text-primary-light)}.card button:hover{background:var(--btn-hover);color:#fff;transform:translateY(-1px)}.result-area{position:relative;margin-top:.5rem}.copy-btn{position:absolute;bottom:.8rem;right:.8rem;background:var(--copy-btn-bg-dark);border:none;border-radius:1rem;padding:.2rem .6rem;color:var(--text-secondary-dark);font-size:.7rem;cursor:pointer;backdrop-filter:blur(4px);transition:background .2s,color .2s}body.light .copy-btn{background:var(--copy-btn-bg-light);color:var(--text-secondary-light)}.copy-btn:hover{background:var(--accent);color:#fff}@media(max-width:700px){body{padding:1rem}.top-bar{flex-direction:column;gap:.8rem;align-items:stretch;text-align:center}.nav-buttons{justify-content:center}.card{padding:1.2rem}}</style></head><body><div class="bg-layer bg-dark"></div><div class="bg-layer bg-light"></div><div class=container><div class=top-bar><div class=nav-buttons><a href=index.html class=nav-btn>← 返回工具箱</a><button id=themeToggle class=nav-btn>🌙 切换主题</button></div></div><div class=card><h2>🔗 URL 编码/解码</h2><textarea id=urlIn rows=3 placeholder="输入要编码或解码的文本..."></textarea><div class=btn-group><button id=urlEnc>URL 编码</button><button id=urlDec>URL 解码</button><button id=urlClr>清空</button><button id=urlSwap>交换</button></div><div class=result-area><textarea id=urlOut rows=3 readonly placeholder="结果..."></textarea><button class=copy-btn data-target=urlOut>复制</button></div></div><div class=card><h2>📦 Base64 编码/解码</h2><textarea id=b64In rows=3 placeholder="输入文本或Base64字符串..."></textarea><div class=btn-group><button id=b64Enc>Base64 编码</button><button id=b64Dec>Base64 解码</button><button id=b64Clr>清空</button><button id=b64Swap>交换</button></div><div class=result-area><textarea id=b64Out rows=3 readonly placeholder="结果..."></textarea><button class=copy-btn data-target=b64Out>复制</button></div></div></div><script>(function(){function copy(btn){let t=btn.getAttribute('data-target'),ta=document.getElementById(t);if(ta&&ta.value){let tx=document.createElement('textarea');tx.value=ta.value;tx.style.position='fixed';tx.style.top='-9999px';tx.style.left='-9999px';document.body.appendChild(tx);tx.select();tx.setSelectionRange(0,ta.value.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(tx);if(ok){let o=btn.textContent;btn.textContent='已复制';setTimeout(()=>btn.textContent=o,1500)}else alert('复制失败')}else alert('无内容可复制')}document.querySelectorAll('.copy-btn').forEach(b=>b.addEventListener('click',()=>copy(b)));let a=document.getElementById('urlIn'),b=document.getElementById('urlOut');document.getElementById('urlEnc').onclick=()=>{let v=a.value;if(v===''){b.value='';return}try{b.value=encodeURIComponent(v)}catch(e){b.value='编码错误'}};document.getElementById('urlDec').onclick=()=>{let v=a.value;if(v===''){b.value='';return}try{b.value=decodeURIComponent(v)}catch(e){b.value='解码错误'}};document.getElementById('urlClr').onclick=()=>{a.value='';b.value=''};document.getElementById('urlSwap').onclick=()=>{let t=a.value;a.value=b.value;b.value=t};let c=document.getElementById('b64In'),d=document.getElementById('b64Out');document.getElementById('b64Enc').onclick=()=>{let v=c.value;if(v===''){d.value='';return}try{let u8=new TextEncoder().encode(v),bin='';for(let i=0;i<u8.length;i++)bin+=String.fromCharCode(u8[i]);d.value=btoa(bin)}catch(e){d.value='编码失败'}};document.getElementById('b64Dec').onclick=()=>{let v=c.value;if(v===''){d.value='';return}try{let bin=atob(v),bts=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bts[i]=bin.charCodeAt(i);d.value=new TextDecoder().decode(bts)}catch(e){d.value='解码失败'}};document.getElementById('b64Clr').onclick=()=>{c.value='';d.value=''};document.getElementById('b64Swap').onclick=()=>{let t=c.value;c.value=d.value;d.value=t};function setTheme(isDark){if(isDark){document.body.classList.remove('light');}else{document.body.classList.add('light');}localStorage.setItem('xwtools_theme',isDark?'dark':'light');let btn=document.getElementById('themeToggle');if(btn)btn.innerHTML=isDark?'☀️ 切换主题':'🌙 切换主题';}function toggleTheme(){let cur=document.body.classList.contains('light');setTheme(cur);}let saved=localStorage.getItem('xwtools_theme');let isDarkDefault=!window.matchMedia||window.matchMedia('(prefers-color-scheme: dark)').matches;let isDark=saved?saved==='dark':isDarkDefault;if(!isDark)document.body.classList.add('light');setTheme(isDark);document.getElementById('themeToggle').addEventListener('click',toggleTheme);})();</script></body></html>
