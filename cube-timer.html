<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>魔方计时器</title><style>html,body{overflow-x:auto;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;background:transparent;display:none}.modal-content{overflow-y:auto!important;scrollbar-width:none;-ms-overflow-style:none}.modal-content::-webkit-scrollbar{width:0;height:0;background:transparent;display:none}*{margin:0;padding:0;box-sizing:border-box;user-select:none}:root{--bg-body:linear-gradient(145deg,#1a1e2c 0%,#0f1219 100%);--container-bg:rgba(18,22,35,0.65);--border-light:rgba(255,255,255,0.1);--time-digit-color:#cafaff;--time-digit-shadow:0 0 8px #00ccff;--observe-bg:#10141fcc;--observe-label-color:#ffd966;--status-bg:#232a3f;--btn-bg:#262e44;--btn-primary-bg:#3a4a7a;--records-bg:rgba(0,0,0,0.35);--scramble-bg:rgba(0,0,0,0.3);--scramble-text:#b9e2ff;--text-primary:#eef5ff;--text-secondary:#8e9bb5;--modal-bg:#1e243b;--ao5-color:#76e6ff}[data-theme=light]{--bg-body:linear-gradient(145deg,#e2e8f0 0%,#cbd5e1 100%);--container-bg:rgba(255,255,255,0.75);--border-light:rgba(0,0,0,0.1);--time-digit-color:#0f172a;--time-digit-shadow:0 0 4px #3b82f6;--observe-bg:#e2e8f0cc;--observe-label-color:#b45309;--status-bg:#d1d5db;--btn-bg:#e2e8f0;--btn-primary-bg:#3b82f6;--records-bg:rgba(0,0,0,0.05);--scramble-bg:rgba(0,0,0,0.05);--scramble-text:#1e293b;--text-primary:#0f172a;--text-secondary:#475569;--modal-bg:#fff;--ao5-color:#2563eb}.theme-pulse{animation:themeFlash .25s ease-out}.scramble-animate{animation:scrambleFlash .2s ease-out}@keyframes themeFlash{0%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0.6)}30%{box-shadow:inset 0 0 0 6px rgba(255,255,255,0.4)}100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}}@keyframes scrambleFlash{0%{background-color:rgba(255,255,255,0.6);transform:scale(0.98)}100%{background-color:var(--scramble-bg);transform:scale(1)}}body{background:var(--bg-body);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI','Poppins','Roboto','Courier New',monospace;padding:20px;transition:background .3s ease}.timer-container{max-width:1300px;width:100%;background:var(--container-bg);backdrop-filter:blur(2px);border-radius:3rem;padding:2rem 1.5rem 2rem 1.5rem;box-shadow:0 25px 45px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.08);border:1px solid var(--border-light);position:relative;transition:background .3s,border .3s,box-shadow .3s;cursor:pointer}.back-btn{position:absolute;top:8px;left:16px;background:var(--btn-bg);border:1px solid var(--border-light);border-radius:40px;padding:5px 12px;font-size:.8rem;cursor:pointer;color:var(--text-secondary);display:flex;align-items:center;gap:6px;transition:.2s;backdrop-filter:blur(4px);text-decoration:none;z-index:10}.back-btn:hover{background:var(--btn-primary-bg);color:#fff;transform:scale(1.02)}.theme-btn{position:absolute;top:8px;right:16px;background:var(--btn-bg);border:1px solid var(--border-light);border-radius:40px;padding:5px 12px;font-size:.8rem;cursor:pointer;color:var(--text-secondary);display:flex;align-items:center;gap:6px;transition:.2s;backdrop-filter:blur(4px);z-index:10}.theme-btn:hover{background:var(--btn-primary-bg);color:#fff;transform:scale(1.02)}.dashboard{display:flex;flex-wrap:wrap;gap:2rem;margin-top:.5rem;pointer-events:none}.timer-panel{flex:2;min-width:280px;display:flex;flex-direction:column;align-items:center;pointer-events:auto}.records-panel{flex:1.2;min-width:260px;background:var(--records-bg);border-radius:2rem;padding:1.2rem;backdrop-filter:blur(4px);border:1px solid var(--border-light);pointer-events:auto}.main-time{background:#0b0e16;padding:.8rem 1.5rem;border-radius:4rem;box-shadow:inset 0 5px 10px rgba(0,0,0,.6),0 8px 20px rgba(0,0,0,.3);margin-bottom:1.5rem;width:100%;text-align:center}[data-theme=light] .main-time{background:#e2e8f0;box-shadow:inset 0 1px 3px rgba(0,0,0,.1),0 4px 12px rgba(0,0,0,.1)}.time-digits{font-size:clamp(3rem,15vw,6rem);font-weight:800;font-family:'Courier New','Fira Mono',monospace;letter-spacing:6px;color:var(--time-digit-color);text-shadow:var(--time-digit-shadow)}.scramble-area{background:var(--scramble-bg);border-radius:2rem;padding:.8rem 1.2rem;margin:.5rem 0 1rem;text-align:center;width:100%;border:1px solid var(--border-light);position:relative;overflow:hidden;transition:background .2s,transform .2s}.scramble-label{font-size:.8rem;font-weight:500;color:var(--text-secondary);letter-spacing:1px}.scramble-text{font-family:'Courier New',monospace;font-size:1rem;font-weight:600;word-break:break-word;color:var(--scramble-text);margin-top:4px;padding-right:70px}.refresh-scramble-btn{position:absolute;bottom:8px;right:12px;background:var(--btn-bg);border:1px solid var(--border-light);border-radius:40px;padding:4px 10px;font-size:.7rem;cursor:pointer;color:var(--text-secondary);transition:.2s;pointer-events:auto}.refresh-scramble-btn:hover{background:var(--btn-primary-bg);color:#fff}.observe-area{background:var(--observe-bg);border-radius:3rem;padding:.6rem 1.5rem;margin:.8rem 0;text-align:center;width:100%;transition:all .2s}.observe-label{font-size:1rem;font-weight:500;color:var(--observe-label-color);letter-spacing:1px}.observe-count{font-size:2.5rem;font-weight:800;font-family:monospace;color:#ffb347;text-shadow:0 0 5px #ff8c00}[data-theme=light] .observe-count{color:#d97706}.status-badge{background:var(--status-bg);padding:.3rem 1rem;border-radius:40px;font-size:.9rem;font-weight:bold;color:var(--text-primary);display:inline-block;margin:12px 0}.button-bar{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;margin-top:20px}.btn{background:var(--btn-bg);border:none;color:var(--text-primary);padding:10px 20px;border-radius:60px;font-weight:bold;font-size:1rem;cursor:pointer;transition:.2s;box-shadow:0 4px 8px rgba(0,0,0,.3);font-family:inherit;pointer-events:auto}.btn-primary{background:var(--btn-primary-bg);box-shadow:0 0 6px #5f7fbf}.btn-primary:hover{background:#4e62a0;transform:scale(1.02)}.btn-danger{background:#6d3a4a}.btn-danger:hover{background:#8f4b60}.btn:hover{filter:brightness(1.05);transform:translateY(-2px)}.section-title{font-size:1.3rem;font-weight:600;border-left:5px solid #2ec7ff;padding-left:12px;margin-bottom:18px;color:var(--text-primary)}.ao5-box{background:#0f1420;border-radius:1.5rem;padding:10px 15px;text-align:center;margin-bottom:20px}[data-theme=light] .ao5-box{background:#e2e8f0}.ao5-value{font-size:2rem;font-weight:800;font-family:monospace;color:var(--ao5-color)}.recent-list{list-style:none;margin-top:10px}.recent-list li{background:rgba(255,255,255,.05);margin:8px 0;padding:10px 15px;border-radius:1.2rem;display:flex;justify-content:space-between;font-family:monospace;font-size:1.1rem;font-weight:500;border-left:3px solid #57c0ff;color:var(--text-primary)}[data-theme=light] .recent-list li{background:rgba(0,0,0,.03)}.recent-index{color:var(--text-secondary)}.recent-time{color:var(--text-primary);letter-spacing:1px}.empty-hint{color:var(--text-secondary);text-align:center;padding:20px;font-style:italic}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:1000;justify-content:center;align-items:center}.modal-content{background:var(--modal-bg);border-radius:2rem;width:90%;max-width:900px;max-height:80vh;overflow-y:auto;padding:1.8rem;box-shadow:0 20px 35px #000;border:1px solid #6f8fc0;color:var(--text-primary)}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;font-size:1.6rem;font-weight:bold}.history-table{width:100%;border-collapse:collapse;color:var(--text-primary);font-size:.85rem}.history-table th,.history-table td{padding:10px 6px;border-bottom:1px solid #3a425c;text-align:center;vertical-align:middle}[data-theme=light] .history-table th,[data-theme=light] .history-table td{border-bottom-color:#cbd5e1}.scramble-cell{max-width:200px;word-break:break-word;font-family:monospace;font-size:.75rem}.del-btn,.practice-btn{background:#aa3e4c;border:none;color:#fff;padding:4px 8px;border-radius:30px;cursor:pointer;font-weight:bold;font-size:.7rem;margin:0 2px}.practice-btn{background:#3a6ea5}.practice-btn:hover{background:#2c5282}.clear-btn{background:#942c3c;margin-top:15px;width:100%}.setting-group{display:flex;justify-content:space-between;align-items:center;margin:15px 0;gap:20px;flex-wrap:wrap}.setting-group label{font-weight:bold}input{background:#0e1220;border:1px solid #5c71a0;padding:10px 15px;border-radius:2rem;color:#fff;font-size:1rem;width:100px;text-align:center}[data-theme=light] input{background:#f1f5f9;color:#0f172a;border-color:#cbd5e1}.close-modal{background:#4a6085;border:none;font-size:1.3rem;cursor:pointer;padding:5px 15px;border-radius:2rem;color:#fff}footer{font-size:.7rem;text-align:center;margin-top:1rem;opacity:.5;color:var(--text-secondary)}@media(max-width:780px){.timer-container{padding:1.2rem}.time-digits{font-size:3rem}.history-table{font-size:.7rem}.scramble-cell{max-width:120px}}</style></head><body><div class="timer-container" id="tapZone"><a href="index.html" class="back-btn">← 返回工具箱</a><div class="theme-btn" id="tTb">🌙 切换主题</div><div class="dashboard"><div class="timer-panel"><div class="main-time"><div class="time-digits" id="td">00:00.00</div></div><div class="scramble-area" id="scrambleArea"><div class="scramble-label">🎲 打乱公式</div><div class="scramble-text" id="stxt">R U R' U'</div><button class="refresh-scramble-btn" id="rfsBtn">🔄 换一组</button></div><div class="observe-area" id="obArea"><div class="observe-label">⏳ 观察倒计时</div><div class="observe-count" id="obCnt">--</div></div><div class="status-badge" id="stsTxt">⚡ 空闲 | 按空格或点击屏幕起表</div><div class="button-bar"><button class="btn btn-primary" id="setBtn">⚙️ 设置</button><button class="btn" id="histBtn">📋 全部历史</button><button class="btn" id="rstHistBtn">🗑️ 清空记录</button></div><div style="font-size:.75rem; margin-top:20px; color:var(--text-secondary);">✨ 空格 / 点击屏幕: 空闲/观察中开始观察/中止观察；计时中点按停止计次</div></div><div class="records-panel"><div class="section-title">📊 最近5次 · AO5</div><div class="ao5-box"><span style="font-size:.9rem; color:var(--text-secondary);">当前AO5 (去尾平均)</span><div class="ao5-value" id="ao5Val">0.00</div></div><div class="section-title" style="font-size:1rem;">📝 前5条记录</div><ul class="recent-list" id="rList"><li class="empty-hint">暂无记录，按空格开始</li></ul></div></div><footer>魔方计时器 | 观察倒计时可调 | 历史永久保存</footer></div><div id="sModal" class="modal"><div class="modal-content"><div class="modal-header"><span>⚙️ 计时器设置</span><button class="close-modal" id="clsSetBtn">&times;</button></div><div class="setting-group"><label>⏱️ 观察时间 (秒):</label><input type="number" id="obTimeInp" min="1" max="30" step="1" value="8"><small style="color:var(--text-secondary);">空格起表后倒计时，结束后自动开始计时</small></div><button id="saveSetBtn" class="btn btn-primary" style="margin-top:20px; width:100%">保存设置</button></div></div><div id="hModal" class="modal"><div class="modal-content"><div class="modal-header"><span>📜 所有历史记录</span><button class="close-modal" id="clsHistBtn">&times;</button></div><div style="max-height:55vh;overflow-y:auto;"><table class="history-table" id="histTab"><thead><tr><th>#</th><th>成绩</th><th>打乱公式</th><th>时间戳</th><th>操作</th></tr></thead><tbody id="histTbody"><tr><td colspan="5">暂无记录</td></tr></tbody></table></div><button id="clearAllHistBtn" class="clear-btn btn-danger" style="margin-top:15px;">清空全部记录</button></div></div><script>let H=[],C=8,S='idle',OI=null,MI=null,OSL=0,TST=0,CEM=0;const D1=document.getElementById('td'),D2=document.getElementById('obCnt'),ST=document.getElementById('stsTxt'),RUL=document.getElementById('rList'),A5S=document.getElementById('ao5Val'),SM=document.getElementById('sModal'),HM=document.getElementById('hModal'),OTI=document.getElementById('obTimeInp'),SSB=document.getElementById('saveSetBtn'),SETB=document.getElementById('setBtn'),HISB=document.getElementById('histBtn'),RHb=document.getElementById('rstHistBtn'),CSB=document.getElementById('clsSetBtn'),CHB=document.getElementById('clsHistBtn'),CAHB=document.getElementById('clearAllHistBtn'),HTB=document.getElementById('histTbody'),RFB=document.getElementById('rfsBtn'),TZ=document.getElementById('tapZone'),ScrambleArea=document.getElementById('scrambleArea');function FMT(ms){if(ms<0)ms=0;let m=Math.floor(ms/6e4),s=Math.floor((ms%6e4)/1e3),cs=Math.floor((ms%1e3)/10);return m+':'+s.toString().padStart(2,'0')+'.'+cs.toString().padStart(2,'0');}function UOD(v){D2.innerText=v===undefined?'--':v;}function UMTD(){if(S==='timing'&&TST>0){let n=Date.now(),e=n-TST;CEM=e;D1.innerText=FMT(e);}else if(S==='idle')D1.innerText=FMT(0);else if(S==='observing')D1.innerText=FMT(0);else D1.innerText=FMT(CEM);}function LD(){let sh=localStorage.getItem('rubik_history');if(sh){try{H=JSON.parse(sh);}catch(e){H=[];}}else H=[];let so=localStorage.getItem('rubik_observe_sec');if(so!==null){C=parseInt(so,10);if(isNaN(C)||C<1)C=8;}else C=8;OTI.value=C;R5();}function SHS(){localStorage.setItem('rubik_history',JSON.stringify(H));}function SOS(){localStorage.setItem('rubik_observe_sec',C);}function GSC(){let mvs=["R","R'","R2","L","L'","L2","U","U'","U2","D","D'","D2","F","F'","F2","B","B'","B2"],map={R:["U","U'","U2","D","D'","D2","F","F'","F2","B","B'","B2"],"R'":["U","U'","U2","D","D'","D2","F","F'","F2","B","B'","B2"],R2:["U","U'","U2","D","D'","D2","F","F'","F2","B","B'","B2"],L:["U","U'","U2","D","D'","D2","F","F'","F2","B","B'","B2"],"L'":["U","U'","U2","D","D'","D2","F","F'","F2","B","B'","B2"],L2:["U","U'","U2","D","D'","D2","F","F'","F2","B","B'","B2"],U:["R","R'","R2","L","L'","L2","F","F'","F2","B","B'","B2"],"U'":["R","R'","R2","L","L'","L2","F","F'","F2","B","B'","B2"],U2:["R","R'","R2","L","L'","L2","F","F'","F2","B","B'","B2"],D:["R","R'","R2","L","L'","L2","F","F'","F2","B","B'","B2"],"D'":["R","R'","R2","L","L'","L2","F","F'","F2","B","B'","B2"],D2:["R","R'","R2
