<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes"><title>密码生成器 + 强度检测 · xwtools</title><style>html,body{overflow-x:auto;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;background:transparent;display:none}textarea,input[type="text"],.password-display,.strength-bar{scrollbar-width:none;-ms-overflow-style:none}textarea::-webkit-scrollbar,input[type="text"]::-webkit-scrollbar,.password-display::-webkit-scrollbar,.strength-bar::-webkit-scrollbar{width:0;height:0;background:transparent;display:none}:root{--bg-dark:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);--bg-light:linear-gradient(135deg,#f1f5f9 0%,#e2e8f0 100%);--card-bg-dark:rgba(15,23,42,.7);--card-bg-light:rgba(255,255,255,.85);--text-primary-dark:#e2e8f0;--text-primary-light:#0f172a;--text-secondary-dark:#94a3b8;--text-secondary-light:#334155;--border-color-dark:rgba(71,85,105,.5);--border-color-light:rgba(0,0,0,.1);--accent:#3b82f6;--input-bg-dark:rgba(0,0,0,.2);--input-bg-light:rgba(0,0,0,.03);--btn-bg-dark:rgba(59,130,246,.2);--btn-bg-light:rgba(59,130,246,.1);--btn-hover:#3b82f6;--shadow-dark:0 25px 40px -12px rgba(0,0,0,.4);--shadow-light:0 25px 40px -12px rgba(0,0,0,.2)}*{margin:0;padding:0;box-sizing:border-box}.bg-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;transition:opacity 0.6s cubic-bezier(0.4,0,0.2,1)}.bg-dark{background:var(--bg-dark);opacity:1}.bg-light{background:var(--bg-light);opacity:0}body.light .bg-dark{opacity:0}body.light .bg-light{opacity:1}.theme-pulse{animation:cardFlash 0.25s ease-out}@keyframes cardFlash{0%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0.6)}30%{box-shadow:inset 0 0 0 6px rgba(255,255,255,0.4)}100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}}body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding:2rem 1.5rem;transition:color .2s ease;position:relative;color:var(--text-primary-dark)}body.light{color:var(--text-primary-light)}.container{max-width:800px;margin:0 auto;position:relative;z-index:1}.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card-bg-dark);backdrop-filter:blur(16px);border-radius:2rem;padding:.6rem 1.2rem;margin-bottom:2rem;border:1px solid var(--border-color-dark);box-shadow:0 4px 12px rgba(0,0,0,.1);transition:background .3s,border .3s}body.light .top-bar{background:var(--card-bg-light);border-color:var(--border-color-light)}.nav-buttons{display:flex;gap:12px}.nav-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.15);padding:6px 14px;border-radius:40px;text-decoration:none;color:var(--text-secondary-dark);font-size:.85rem;font-weight:500;border:1px solid var(--border-color-dark);transition:all .2s ease;cursor:pointer}body.light .nav-btn{color:var(--text-secondary-light);border-color:var(--border-color-light)}.nav-btn:hover{background:var(--accent);color:#fff;transform:translateY(-1px)}.card{background:var(--card-bg-dark);backdrop-filter:blur(16px);border-radius:2rem;border:1px solid var(--border-color-dark);padding:1.8rem;margin-bottom:1.5rem;box-shadow:var(--shadow-dark);transition:background .3s,border .3s,box-shadow .3s;position:relative;overflow:hidden}body.light .card{background:var(--card-bg-light);border-color:var(--border-color-light);box-shadow:var(--shadow-light)}h2{font-size:1.4rem;margin-bottom:1rem;color:var(--accent)}.password-display{background:var(--input-bg-dark);border-radius:1rem;padding:1rem;font-family:monospace;font-size:1.2rem;text-align:center;position:relative;margin-bottom:1rem;word-break:break-all;border:1px solid var(--border-color-dark);overflow-x:auto;white-space:normal;transition:background .3s,border .3s,color .3s}body.light .password-display{background:var(--input-bg-light);border-color:var(--border-color-light)}.copy-btn{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:var(--input-bg-dark);border:1px solid var(--border-color-dark);padding:.2rem .8rem;border-radius:2rem;color:var(--text-secondary-dark);cursor:pointer;font-size:.7rem;transition:all .2s ease}body.light .copy-btn{background:var(--input-bg-light);border-color:var(--border-color-light);color:var(--text-secondary-light)}.copy-btn:hover{background:var(--accent);color:#fff}.strength-bar{height:6px;background:var(--border-color-dark);border-radius:3px;margin:.5rem 0;overflow:hidden;transition:background .3s}body.light .strength-bar{background:var(--border-color-light)}.strength-fill{width:0;height:100%;transition:width .3s,background .2s}.config-row{display:flex;justify-content:space-between;align-items:center;margin:.8rem 0;flex-wrap:wrap;gap:.5rem}input[type=range]{flex:1;min-width:150px}.checkbox-group{display:flex;gap:1rem;flex-wrap:wrap;margin:.8rem 0}button{background:var(--btn-bg-dark);border:1px solid var(--border-color-dark);padding:.5rem 1rem;border-radius:2rem;color:var(--text-primary-dark);cursor:pointer;transition:all .2s ease;font-size:.85rem}body.light button{background:var(--btn-bg-light);border-color:var(--border-color-light);color:var(--text-primary-light)}button:hover{background:var(--btn-hover);color:#fff;transform:translateY(-1px)}.gen-btn{background:var(--accent);color:#fff;border:none}.gen-btn:hover{filter:brightness(1.05)}@media(max-width:700px){body{padding:1rem}.top-bar{flex-direction:column;gap:.8rem;align-items:stretch;text-align:center}.nav-buttons{justify-content:center}.card{padding:1.2rem}}</style></head><body><div class="bg-layer bg-dark"></div><div class="bg-layer bg-light"></div><div class=container><div class=top-bar><div class=nav-buttons><a href=index.html class=nav-btn>← 返回工具箱</a><button id=tBtn class=nav-btn>🌙 切换主题</button></div></div><div class=card id=card1><h2>🔐 随机密码生成器</h2><div class=password-display><span id=pw>点击生成</span><button class=copy-btn id=cpBtn>复制</button></div><div class=strength-bar><div class=strength-fill id=gs></div></div><div id=gf style="font-size:.8rem;margin-bottom:1rem;color:var(--text-secondary-dark);transition:color .2s"></div><div class=config-row><label>长度: <span id=lv>16</span></label><input type=range id=ls min=4 max=32 value=16></div><div class=checkbox-group><label><input type=checkbox id=cu checked> 大写字母</label><label><input type=checkbox id=cl checked> 小写字母</label><label><input type=checkbox id=cn checked> 数字</label><label><input type=checkbox id=cs checked> 符号</label><label><input type=checkbox id=ea> 排除相似字符</label></div><div><button id=gb class=gen-btn>生成新密码</button><button id=rb>重新生成</button></div></div><div class=card id=card2><h2>🔍 自定义密码强度检测</h2><input type=text id=cp placeholder="输入任意密码..." style="width:100%;padding:.8rem;background:var(--input-bg-dark);border:1px solid var(--border-color-dark);border-radius:1rem;color:var(--text-primary-dark);margin-bottom:1rem;transition:background .3s,border .3s,color .2s"><div class=strength-bar><div class=strength-fill id=csb></div></div><div id=cfb style="font-size:.8rem;color:var(--text-secondary-dark);transition:color .2s"></div></div></div><script>function S(t){if(!t)return{score:0,text:"--",color:"#64748b",feedback:"输入密码后评估"};let e=0,n=0;/[a-z]/.test(t)&&n++;/[A-Z]/.test(t)&&n++;/[0-9]/.test(t)&&n++;/[^a-zA-Z0-9]/.test(t)&&n++;let o=t.length;o>=8&&(e+=20),o>=12&&(e+=20),o>=16&&(e+=20),o>=20&&(e+=20),e+=n*10,o>=12&&n>=3&&(e+=10),o>=16&&n>=4&&(e+=10);let s,l,c;return e<30?(s="弱",l="#ef4444",c="密码较短或类型单一"):e<60?(s="中",l="#f59e0b",c="强度中等，可增加长度或组合"):(s="强",l="#10b981",c="强度很好"),{score:Math.min(100,e),text:s,color:l,feedback:c}}function U(e,n,o){let s=S(o);document.getElementById(e).style.width=s.score+"%",document.getElementById(e).style.backgroundColor=s.color,document.getElementById(n).textContent=s.feedback}const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ",a="abcdefghijklmnopqrstuvwxyz",d0="0123456789",s1="!@#$%^&*()_+-=[]{}|;:,.<>?",x="iIl1oO0";let C="";function B(){let e="";return cu.checked&&(e+=A),cl.checked&&(e+=a),cn.checked&&(e+=d0),cs.checked&&(e+=s1),ea.checked&&(e=e.split("").filter(t=>!x.includes(t)).join("")),e}function R(t,e){let n=new Uint32Array(t);crypto.getRandomValues(n);let o="";for(let s=0;s<t;s++)o+=e[n[s]%e.length];return o}function G(){let t=parseInt(ls.value,10),e=B();if(0===e.length){document.getElementById("pw").textContent="请至少选择一种字符";C="";return}let n=R(t,e),o=0,s=[];cu.checked&&s.push(/[A-Z]/),cl.checked&&s.push(/[a-z]/),cn.checked&&s.push(/[0-9]/),cs.checked&&s.push(/[!@#$%^&*()_+\-=[\]{}|;:,.<>?]/);while(o<10&&s.length>0){if(s.every(r=>r.test(n)))break;n=R(t,e);o++}C=n,document.getElementById("pw").textContent=C;let l=S(C);document.getElementById("gs").style.width=l.score+"%",document.getElementById("gs").style.backgroundColor=l.color,document.getElementById("gf").textContent=l.feedback}function copyFallback(t){let n=document.createElement("textarea");n.value=t,n.style.position="fixed",n.style.top="-9999px",n.style.left="-9999px",document.body.appendChild(n),n.select(),n.setSelectionRange(0,t.length);let o=!1;try{o=document.execCommand("copy")}catch(e){console.warn(e)}document.body.removeChild(n);return o}let ls=document.getElementById("ls"),lv=document.getElementById("lv");ls.addEventListener("input",()=>{lv.textContent=ls.value,G()});let cu=document.getElementById("cu"),cl=document.getElementById("cl"),cn=document.getElementById("cn"),cs=document.getElementById("cs"),ea=document.getElementById("ea");[cu,cl,cn,cs,ea].forEach(c=>c.addEventListener("change",G));document.getElementById("gb").addEventListener("click",G);document.getElementById("rb").addEventListener("click",G);document.getElementById("cpBtn").addEventListener("click",function(){let btn=this;if(!C){alert("请先点击「生成新密码」或「重新生成」");return}let success=copyFallback(C);if(success){let original=btn.textContent;btn.textContent="已复制";setTimeout(()=>btn.textContent=original,1500)}else alert("❌ 复制失败，请手动选择复制")});G();let cp=document.getElementById("cp");cp.addEventListener("input",()=>{U("csb","cfb",cp.value)});function setTheme(isDark){if(isDark){document.body.classList.remove('light');}else{document.body.classList.add('light');}localStorage.setItem('xwtools_theme',isDark?'dark':'light');let btn=document.getElementById('tBtn');if(btn)btn.innerHTML=isDark?'☀️ 切换主题':'🌙 切换主题';let cards=document.querySelectorAll('.card');cards.forEach(c=>{c.classList.add('theme-pulse');setTimeout(()=>c.classList.remove('theme-pulse'),300);});}function toggleTheme(){let cur=document.body.classList.contains('light');setTheme(cur);}let saved=localStorage.getItem('xwtools_theme');let isDarkDefault=!window.matchMedia||window.matchMedia('(prefers-color-scheme: dark)').matches;let isDark=saved?saved==='dark':isDarkDefault;if(!isDark)document.body.classList.add('light');setTheme(isDark);document.getElementById('tBtn').addEventListener('click',toggleTheme);</script></body></html>
