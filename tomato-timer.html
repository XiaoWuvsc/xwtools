<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes"><title>番茄钟计时器 · xwtools</title><style>html,body{overflow-x:auto;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}.bg-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;pointer-events:none;transition:opacity 0.6s ease}.bg-dark{background:linear-gradient(135deg,#0f172a,#1e293b);opacity:1}.bg-light{background:linear-gradient(135deg,#f1f5f9,#e2e8f0);opacity:0}[data-theme=light] .bg-dark{opacity:0}[data-theme=light] .bg-light{opacity:1}:root{--card-bg:rgba(15,23,42,.7);--text-primary:#e2e8f0;--text-secondary:#94a3b8;--border-color:rgba(71,85,105,.5);--accent:#3b82f6;--input-bg:rgba(0,0,0,.2);--btn-bg:rgba(59,130,246,.2);--shadow:0 25px 40px -12px #0006}[data-theme=light]{--card-bg:#ffffffd9;--text-primary:#0f172a;--text-secondary:#334155;--border-color:#0000001a;--input-bg:#00000008;--btn-bg:#3b82f61a}body{font-family:Inter,system-ui,sans-serif;min-height:100vh;padding:2rem 1rem;transition:color .2s;color:var(--text-primary);background:transparent;margin:0}.container{max-width:600px;margin:0 auto;position:relative;z-index:1}.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card-bg);backdrop-filter:blur(16px);border-radius:2rem;padding:.6rem 1.2rem;margin-bottom:2rem;border:1px solid var(--border-color)}.nav-buttons{display:flex;gap:12px}.nav-btn{display:inline-flex;align-items:center;gap:6px;background:#3b82f626;padding:8px 16px;border-radius:40px;text-decoration:none;color:var(--text-secondary);font-size:.9rem;font-weight:500;border:1px solid var(--border-color);cursor:pointer;min-height:44px;min-width:80px;justify-content:center}.nav-btn:active{transform:scale(0.97)}.card{background:var(--card-bg);backdrop-filter:blur(16px);border-radius:2rem;border:1px solid var(--border-color);padding:1.5rem;box-shadow:var(--shadow);text-align:center}.timer-type{font-size:1.2rem;font-weight:500;margin-bottom:.5rem;color:var(--text-secondary)}.timer-display{font-size:5rem;font-weight:800;font-family:'Courier New',monospace;letter-spacing:4px;margin:1rem 0;color:var(--text-primary)}.phase-indicator{display:inline-block;padding:.3rem 1rem;border-radius:40px;font-size:.9rem;font-weight:600;margin-bottom:1.5rem}.phase-work{background:#ef444433;color:#ef4444}.phase-break{background:#10b98133;color:#10b981}[data-theme=light] .phase-work{background:#ef44441a}[data-theme=light] .phase-break{background:#10b9811a}.settings-panel{background:var(--input-bg);border-radius:1.5rem;padding:1rem;margin:1rem 0;display:flex;justify-content:center;gap:1rem;flex-wrap:wrap}.setting-item{display:flex;align-items:center;gap:.5rem}.setting-item label{font-size:.85rem;color:var(--text-secondary)}.setting-item input{width:70px;padding:.4rem;background:var(--input-bg);border:1px solid var(--border-color);border-radius:1rem;color:var(--text-primary);text-align:center}.btn-group{display:flex;gap:1rem;justify-content:center;margin:1.5rem 0}button{background:var(--btn-bg);border:1px solid var(--border-color);padding:.6rem 1.2rem;border-radius:2rem;color:var(--text-primary);cursor:pointer;font-size:.9rem;font-weight:500;min-height:44px;min-width:100px}.start-pause-btn{background:var(--accent);color:#fff;border:none}.reset-btn{background:#ef444433;border-color:#ef44444d}.note{font-size:.7rem;color:var(--text-secondary);margin-top:1rem}@media(max-width:700px){body{padding:1rem}.top-bar{flex-direction:column;gap:.8rem}.timer-display{font-size:3rem}}</style></head><body><div class="bg-layer bg-dark"></div><div class="bg-layer bg-light"></div><div class=container><div class=top-bar><div class=nav-buttons><a href=index.html class=nav-btn>← 返回</a><button id=themeToggleBtn class=nav-btn>🌙 主题</button></div></div><div class=card><div class=timer-type id=phaseLabel>🍅 专注工作</div><div class=timer-display id=timerDisplay>25:00</div><div class=phase-indicator id=phaseIndicator>工作阶段</div><div class=settings-panel><div class=setting-item><label>工作</label><input type=number id=workMinutes min=1 max=99 value=25><span>分</span></div><div class=setting-item><label>休息</label><input type=number id=breakMinutes min=1 max=99 value=5><span>分</span></div></div><div class=btn-group><button id=startPauseBtn class=start-pause-btn>▶ 开始</button><button id=resetBtn class=reset-btn>🔄 重置</button></div><div class=note>💡 结束会发出提示音并弹出通知</div></div></div><script>(function(){let actx=null;function beep(){try{if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)()}let o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=0.3;o.start();g.gain.exponentialRampToValueAtTime(1e-5,actx.currentTime+0.5);o.stop(actx.currentTime+0.5)}catch(e){}}function notify(t,b){if(Notification.permission==='granted')new Notification(t,{body:b});else if(Notification.permission!=='denied')Notification.requestPermission().then(p=>p==='granted'&&new Notification(t,{body:b}))}const d=document.getElementById('timerDisplay'),pl=document.getElementById('phaseLabel'),pi=document.getElementById('phaseIndicator'),wi=document.getElementById('workMinutes'),bi=document.getElementById('breakMinutes'),sp=document.getElementById('startPauseBtn'),rb=document.getElementById('resetBtn');let iv=null,running=!1,phase='work',secs=25*60;function update(){let m=Math.floor(secs/60),s=secs%60;d.textContent=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`}function setPhase(p){phase=p;if(p==='work'){pl.textContent='🍅 专注工作';pi.textContent='工作阶段';pi.className='phase-indicator phase-work';secs=parseInt(wi.value,10)*60}else{pl.textContent='☕ 休息时间';pi.textContent='休息阶段';pi.className='phase-indicator phase-break';secs=parseInt(bi.value,10)*60}update()}function complete(){if(phase==='work'){setPhase('break');notify('番茄钟','工作结束，该休息啦！');beep()}else{setPhase('work');notify('番茄钟','休息结束，开始新的专注！');beep()}if(running)start()}function tick(){if(!running)return;if(secs<=0){complete();return}secs--;update()}function start(){if(iv)clearInterval(iv);running=!0;iv=setInterval(tick,1000);sp.innerHTML='⏸ 暂停'}function pause(){if(iv){clearInterval(iv);iv=null}running=!1;sp.innerHTML='▶ 开始'}function reset(){pause();setPhase('work')}function toggle(){if(running)pause();else{if(secs<=0){if(phase==='work')secs=parseInt(wi.value,10)*60;else secs=parseInt(bi.value,10)*60;update()}start()}}function onWorkChange(){if(!running&&phase==='work'){secs=parseInt(wi.value,10)*60;update()}}function onBreakChange(){if(!running&&phase==='break'){secs=parseInt(bi.value,10)*60;update()}}wi.addEventListener('change',onWorkChange);bi.addEventListener('change',onBreakChange);sp.addEventListener('click',toggle);sp.addEventListener('touchstart',toggle);rb.addEventListener('click',reset);rb.addEventListener('touchstart',reset);setPhase('work');if(Notification.permission==='default')Notification.requestPermission();function setTheme(th){document.documentElement.setAttribute('data-theme',th);localStorage.setItem('xwtools_theme',th);let btn=document.getElementById('themeToggleBtn');if(btn)btn.innerHTML=th==='dark'?'☀️ 主题':'🌙 主题'}function toggleTheme(){let cur=document.documentElement.getAttribute('data-theme')||'dark';setTheme(cur==='dark'?'light':'dark')}let saved=localStorage.getItem('xwtools_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');setTheme(saved);let themeBtn=document.getElementById('themeToggleBtn');if(themeBtn){themeBtn.addEventListener('click',toggleTheme);themeBtn.addEventListener('touchstart',toggleTheme);}})();</script></body></html>
