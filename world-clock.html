<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes"><title>全球时间显示器 · xwtools</title><style>html,body{overflow-x:auto;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0!important;height:0!important;background:transparent!important;display:none!important}div,.city-list,.card,.container,select,input,textarea{scrollbar-width:none;-ms-overflow-style:none}div::-webkit-scrollbar,.city-list::-webkit-scrollbar{display:none;width:0}*{margin:0;padding:0;box-sizing:border-box}.theme-pulse{animation:cardFlash .25s ease-out}@keyframes cardFlash{0%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0.6)}30%{box-shadow:inset 0 0 0 6px rgba(255,255,255,0.4)}100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}}:root{--bg-body:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);--card-bg:rgba(15,23,42,.7);--text-primary:#e2e8f0;--text-secondary:#94a3b8;--border-color:rgba(71,85,105,.5);--accent:#3b82f6;--input-bg:rgba(0,0,0,.2);--btn-bg:rgba(59,130,246,.2);--btn-hover:#3b82f6;--shadow:0 25px 40px -12px rgba(0,0,0,.4);--time-bg:rgba(0,0,0,.3)}[data-theme=light]{--bg-body:linear-gradient(135deg,#f1f5f9 0%,#e2e8f0 100%);--card-bg:rgba(255,255,255,.85);--text-primary:#0f172a;--text-secondary:#334155;--border-color:rgba(0,0,0,.1);--input-bg:rgba(0,0,0,.03);--btn-bg:rgba(59,130,246,.1);--btn-hover:#2563eb;--time-bg:rgba(0,0,0,.03)}body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-body);color:var(--text-primary);min-height:100vh;padding:2rem 1.5rem;transition:background .3s ease,color .2s ease}.container{max-width:900px;margin:0 auto}.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card-bg);backdrop-filter:blur(16px);border-radius:2rem;padding:.6rem 1.2rem;margin-bottom:2rem;border:1px solid var(--border-color);box-shadow:0 4px 12px rgba(0,0,0,.1)}.nav-buttons{display:flex;gap:12px}.nav-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.15);padding:6px 14px;border-radius:40px;text-decoration:none;color:var(--text-secondary);font-size:.85rem;font-weight:500;border:1px solid var(--border-color);transition:all .2s ease;cursor:pointer}.nav-btn:hover{background:var(--accent);color:#fff;transform:translateY(-1px)}.card{background:var(--card-bg);backdrop-filter:blur(16px);border-radius:2rem;border:1px solid var(--border-color);padding:1.5rem;box-shadow:var(--shadow);transition:background .3s,border .3s;position:relative;overflow:hidden}h2{font-size:1.5rem;margin-bottom:1rem;color:var(--accent);display:flex;align-items:center;gap:.5rem}.time-controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border-color)}.format-switch{display:flex;gap:.5rem}.format-btn{background:var(--btn-bg);border:1px solid var(--border-color);padding:.4rem 1rem;border-radius:2rem;font-size:.85rem;cursor:pointer;transition:.2s}.format-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}.add-city{display:flex;gap:.8rem;flex-wrap:wrap}.add-city select,.add-city input{background:var(--input-bg);border:1px solid var(--border-color);border-radius:2rem;padding:.4rem 1rem;color:var(--text-primary);font-size:.85rem}.add-city button{background:var(--accent);border:none;padding:.4rem 1rem;border-radius:2rem;color:#fff;cursor:pointer;transition:.2s}.add-city button:hover{filter:brightness(1.05)}.city-list{display:flex;flex-direction:column;gap:.8rem}.city-item{background:var(--time-bg);border-radius:1.2rem;padding:1rem 1.2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;border:1px solid var(--border-color)}.city-info{flex:2}.city-name{font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:.5rem}.city-timezone{font-size:.7rem;color:var(--text-secondary)}.city-time{font-size:1.6rem;font-weight:700;font-family:monospace;letter-spacing:2px}.city-date{font-size:.7rem;color:var(--text-secondary)}.city-actions{display:flex;gap:.5rem}.city-actions button{background:var(--btn-bg);border:1px solid var(--border-color);padding:.3rem .8rem;border-radius:2rem;cursor:pointer;transition:.2s;font-size:.7rem}.city-actions button:hover{background:var(--btn-hover);color:#fff}.delete-btn:hover{background:#ef4444!important;border-color:#ef4444!important;color:#fff}.empty-hint{text-align:center;color:var(--text-secondary);padding:2rem}footer{margin-top:1rem;font-size:.7rem;text-align:center;color:var(--text-secondary)}@media(max-width:700px){body{padding:1rem}.top-bar{flex-direction:column;gap:.8rem;align-items:stretch}.nav-buttons{justify-content:center}.city-item{flex-direction:column;align-items:flex-start}.city-time{font-size:1.3rem}}</style></head><body><div class=container><div class=top-bar><div class=nav-buttons><a href=index.html class=nav-btn>← 返回工具箱</a><button id=tBtn class=nav-btn>🌙 切换主题</button></div></div><div class=card id=mainCard><h2>🌍 全球时间显示器</h2><div class=time-controls><div class=format-switch><button class=format-btn data-f=24>24小时制</button><button class=format-btn data-f=12>12小时制</button></div><div class=add-city><select id=cS><option value=Asia/Shanghai>🇨🇳 北京 (中国)</option><option value=Asia/Tokyo>🇯🇵 东京 (日本)</option><option value=Asia/Seoul>🇰🇷 首尔 (韩国)</option><option value=Asia/Singapore>🇸🇬 新加坡</option><option value=Asia/Dubai>🇦🇪 迪拜</option><option value=Asia/Kolkata>🇮🇳 新德里 (印度)</option><option value=Europe/London>🇬🇧 伦敦 (英国)</option><option value=Europe/Paris>🇫🇷 巴黎 (法国)</option><option value=Europe/Berlin>🇩🇪 柏林 (德国)</option><option value=America/New_York>🇺🇸 纽约 (美国)</option><option value=America/Los_Angeles>🇺🇸 洛杉矶 (美国)</option><option value=America/Chicago>🇺🇸 芝加哥 (美国)</option><option value=America/Toronto>🇨🇦 多伦多 (加拿大)</option><option value=America/Sao_Paulo>🇧🇷 圣保罗 (巴西)</option><option value=Australia/Sydney>🇦🇺 悉尼 (澳大利亚)</option><option value=Pacific/Auckland>🇳🇿 奥克兰 (新西兰)</option><option value=Africa/Cairo>🇪🇬 开罗 (埃及)</option><option value=Africa/Johannesburg>🇿🇦 约翰内斯堡</option></select><button id=aBtn>➕ 添加</button></div></div><div id=cList class=city-list></div><footer>💡 点击城市右侧「删除」可移除，时间每秒自动刷新</footer></div></div><script>let D=[{id:"Asia/Shanghai",name:"北京",flag:"🇨🇳"},{id:"America/New_York",name:"纽约",flag:"🇺🇸"},{id:"Europe/London",name:"伦敦",flag:"🇬🇧"},{id:"Asia/Tokyo",name:"东京",flag:"🇯🇵"},{id:"Australia/Sydney",name:"悉尼",flag:"🇦🇺"}];let C=[],F='24',I=null;function J(){let S=localStorage.getItem('worldclock_cities');if(S){try{C=JSON.parse(S);}catch(e){C=[...D];}}else{C=[...D];}C.forEach(c=>{if(!c.flag){let f=D.find(d=>d.id===c.id);c.flag=f?f.flag:'🌐';}});K();}function L(){localStorage.setItem('worldclock_cities',JSON.stringify(C));}function M(t,f){let n=new Date;let fmt=new Intl.DateTimeFormat('zh-CN',{timeZone:t,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:f==='12'});return fmt.format(n);}function N(t){let n=new Date;let fmt=new Intl.DateTimeFormat('zh-CN',{timeZone:t,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'});return fmt.format(n);}function O(t){let n=new Date;let fmt=new Intl.DateTimeFormat('en',{timeZone:t,timeZoneName:'shortOffset'});let p=fmt.formatToParts(n);let o=p.find(x=>x.type==='timeZoneName');return o?o.value:'';}function K(){let H=document.getElementById('cList');if(!H)return;if(C.length===0){H.innerHTML='<div class="empty-hint">暂无城市，请添加上方城市</div>';return;}H.innerHTML='';C.forEach((c,i)=>{let t=M(c.id,F),d=N(c.id),z=O(c.id);let it=document.createElement('div');it.className='city-item';it.innerHTML=`<div class="city-info"><div class="city-name"><span>${c.flag||'🌐'}</span><span>${c.name}</span></div><div class="city-timezone">${c.id} ${z}</div><div class="city-date">${d}</div></div><div class="city-time">${t}</div><div class="city-actions"><button class="delete-btn" data-i="${i}">删除</button></div>`;H.appendChild(it);});document.querySelectorAll('.delete-btn').forEach(btn=>{btn.addEventListener('click',(e)=>{let i=parseInt(btn.getAttribute('data-i'),10);if(!isNaN(i)){C.splice(i,1);L();K();}});});}function P(){K();}function Q(f){F=f;localStorage.setItem('worldclock_format',f);document.querySelectorAll('.format-btn').forEach(btn=>{if(btn.getAttribute('data-f')===f)btn.classList.add('active');else btn.classList.remove('active');});P();}function R(){if(I)clearInterval(I);I=setInterval(()=>{P();},1000);}function S(){let s=document.getElementById('cS');let v=s.value;let t=s.options[s.selectedIndex].text;let f='🌐',n=t;let m=t.match(/^([^\s]+)\s+(.+)$/);if(m){f=m[1];n=m[2];}if(C.some(c=>c.id===v)){alert('该城市已添加');return;}C.push({id:v,name:n,flag:f});L();K();}function T(){J();let sf=localStorage.getItem('worldclock_format');if(sf==='12')Q('12');else Q('24');R();document.getElementById('aBtn').addEventListener('click',S);document.querySelectorAll('.format-btn').forEach(btn=>{btn.addEventListener('click',()=>{Q(btn.getAttribute('data-f'));});});}document.addEventListener('visibilitychange',()=>{if(!document.hidden)P();});function setTheme(th){document.documentElement.setAttribute('data-theme',th);localStorage.setItem('xwtools_theme',th);let btn=document.getElementById('tBtn');if(btn)btn.innerHTML=th==='dark'?'☀️ 切换主题':'🌙 切换主题';let card=document.getElementById('mainCard');if(card){card.classList.add('theme-pulse');setTimeout(()=>card.classList.remove('theme-pulse'),300);}}function toggleTheme(){let cur=document.documentElement.getAttribute('data-theme')||'dark';setTheme(cur==='dark'?'light':'dark');}let savedTheme=localStorage.getItem('xwtools_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');setTheme(savedTheme);document.getElementById('tBtn').addEventListener('click',toggleTheme);T();</script></body></html>
