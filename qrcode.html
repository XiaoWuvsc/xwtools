<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes"><title>二维码生成器 · xwtools</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>html,body{overflow-x:auto;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}textarea,.qrcode-container,.card{scrollbar-width:none;-ms-overflow-style:none}textarea::-webkit-scrollbar{display:none}*{margin:0;padding:0;box-sizing:border-box}:root{--bg-gradient-dark:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);--bg-gradient-light:linear-gradient(135deg,#f1f5f9 0%,#e2e8f0 100%);--card-bg-dark:rgba(15,23,42,0.7);--card-bg-light:rgba(255,255,255,0.85);--text-primary-dark:#e2e8f0;--text-primary-light:#0f172a;--text-secondary-dark:#94a3b8;--text-secondary-light:#334155;--border-color-dark:rgba(71,85,105,0.5);--border-color-light:rgba(0,0,0,0.1);--accent:#3b82f6;--input-bg-dark:rgba(0,0,0,0.2);--input-bg-light:rgba(0,0,0,0.03);--btn-bg-dark:rgba(59,130,246,0.2);--btn-bg-light:rgba(59,130,246,0.1);--btn-hover-dark:#3b82f6;--btn-hover-light:#2563eb;--shadow-dark:0 25px 40px -12px rgba(0,0,0,0.4);--shadow-light:0 25px 40px -12px rgba(0,0,0,0.2);--qrcode-bg-dark:#1e293b;--qrcode-bg-light:#ffffff;--qrcode-border-dark:rgba(71,85,105,0.6);--qrcode-border-light:rgba(0,0,0,0.1)}body{font-family:'Inter',system-ui,sans-serif;color:var(--text-primary-dark);min-height:100vh;padding:2rem 1.5rem;transition:color .3s ease;position:relative;background:#0f172a;/* fallback */}#bg-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;transition:opacity 0.6s ease;background:var(--bg-gradient-dark);}#bg-layer-light{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;transition:opacity 0.6s ease;background:var(--bg-gradient-light);opacity:0;}body.light #bg-layer-light{opacity:1;}body.light #bg-layer{opacity:0;}.container{max-width:800px;margin:0 auto;position:relative;z-index:1}@keyframes cardGlowPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,0),0 25px 40px -12px rgba(0,0,0,0.4)}40%{box-shadow:0 0 0 8px rgba(255,255,255,0.3),0 25px 40px -12px rgba(0,0,0,0.4)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0),0 25px 40px -12px rgba(0,0,0,0.4)}}.theme-pulse{animation:cardGlowPulse 0.35s ease-out}.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card-bg-dark);backdrop-filter:blur(16px);border-radius:2rem;padding:.6rem 1.2rem;margin-bottom:2rem;border:1px solid var(--border-color-dark);transition:background .3s, border .3s}body.light .top-bar{background:var(--card-bg-light);border-color:var(--border-color-light);}.nav-buttons{display:flex;gap:12px}.nav-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.15);padding:6px 14px;border-radius:40px;text-decoration:none;color:var(--text-secondary-dark);font-size:.85rem;font-weight:500;border:1px solid var(--border-color-dark);transition:all .2s;cursor:pointer}body.light .nav-btn{color:var(--text-secondary-light);border-color:var(--border-color-light);}.nav-btn:hover{background:var(--accent);color:#fff;transform:translateY(-1px)}.card{background:var(--card-bg-dark);backdrop-filter:blur(16px);border-radius:2rem;border:1px solid var(--border-color-dark);padding:2rem;box-shadow:var(--shadow-dark);text-align:center;transition:background .3s, border .3s, box-shadow .3s}body.light .card{background:var(--card-bg-light);border-color:var(--border-color-light);box-shadow:var(--shadow-light);}h2{font-size:1.6rem;margin-bottom:1rem;color:var(--accent);}.input-group{margin:1.5rem 0}textarea{width:100%;background:var(--input-bg-dark);border:1px solid var(--border-color-dark);border-radius:1.2rem;padding:1rem;color:var(--text-primary-dark);font-family:inherit;font-size:1rem;resize:vertical;transition:background .3s,border .3s,color .3s}body.light textarea{background:var(--input-bg-light);border-color:var(--border-color-light);color:var(--text-primary-light);}textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.2)}.qrcode-container{display:flex;justify-content:center;align-items:center;margin:1.5rem auto;padding:100px;background:var(--qrcode-bg-dark);border-radius:2rem;border:1px solid var(--qrcode-border-dark);box-shadow:0 8px 20px rgba(0,0,0,0.1);transition:background .3s,border .3s;width:fit-content;max-width:100%}body.light .qrcode-container{background:var(--qrcode-bg-light);border-color:var(--qrcode-border-light);}#qrcode{display:flex;justify-content:center;align-items:center;width:100%}#qrcode img,#qrcode canvas{display:block;width:100%;height:auto;max-width:400px;border-radius:0;background:#fff;object-fit:contain;aspect-ratio:1/1}.btn-group{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}button{background:var(--btn-bg-dark);border:1px solid var(--border-color-dark);padding:.6rem 1.2rem;border-radius:2rem;color:var(--text-primary-dark);cursor:pointer;transition:all .2s;font-size:.9rem;font-weight:500}body.light button{background:var(--btn-bg-light);border-color:var(--border-color-light);color:var(--text-primary-light);}button:hover{background:var(--btn-hover-dark);color:#fff;transform:translateY(-1px)}body.light button:hover{background:var(--btn-hover-light);}.download-btn{background:var(--accent);color:#fff;border:none}.download-btn:hover{filter:brightness(1.05)}.note{font-size:.75rem;color:var(--text-secondary-dark);margin-top:1rem;transition:color .3s}body.light .note{color:var(--text-secondary-light);}@media(max-width:700px){body{padding:1rem}.top-bar{flex-direction:column;gap:.8rem;align-items:stretch}.nav-buttons{justify-content:center}.card{padding:1.2rem}.qrcode-container{padding:60px}#qrcode img,#qrcode canvas{max-width:300px}}</style></head><body><div id="bg-layer"></div><div id="bg-layer-light"></div><div class=container><div class=top-bar><div class=nav-buttons><a href=index.html class=nav-btn>← 返回工具箱</a><button id=themeToggleBtn class=nav-btn>🌙 切换主题</button></div></div><div class=card id=mainCard><h2>📱 二维码生成器</h2><div class=input-group><textarea id=textInput rows=3 placeholder="输入文本、网址或任意内容...&#10;例如：xwtools.cn 或 你好，世界！"></textarea></div><div class=qrcode-container><div id=qrcode></div></div><div class=btn-group><button id=generateBtn>✨ 生成二维码</button><button id=downloadBtn class=download-btn>⬇️ 下载 PNG</button></div><div class=note>💡 支持中文、Emoji、网址等。二维码以完整尺寸显示（最大400px），外围100px留白区域随主题变色，二维码本身为直角。</div></div></div><script>const a=document.getElementById('qrcode'),b=document.getElementById('textInput'),c=document.getElementById('generateBtn'),d=document.getElementById('downloadBtn'),e=document.getElementById('mainCard');function f(){let t=b.value.trim();if(!t){t="xwtools.cn";b.value=t;}a.innerHTML='';try{new QRCode(a,{text:t,width:400,height:400,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});}catch(er){a.innerHTML='<div style="color: red; padding: 1rem;">生成失败，请检查输入内容</div>';console.error(er);}}function g(){let i=a.querySelector('img, canvas');if(!i){alert('请先生成二维码');return;}let durl;if(i.tagName==='IMG')durl=i.src;else if(i.tagName==='CANVAS')durl=i.toDataURL('image/png');else{alert('无法获取二维码图像');return;}let l=document.createElement('a');l.download='qrcode.png';l.href=durl;l.click();}c.addEventListener('click',f);d.addEventListener('click',g);b.addEventListener('keydown',(k)=>{if(k.key==='Enter'&&!k.shiftKey){k.preventDefault();f();}});function setTheme(isDark){if(isDark){document.body.classList.remove('light');}else{document.body.classList.add('light');}localStorage.setItem('xwtools_theme',isDark?'dark':'light');const toggleBtn=document.getElementById('themeToggleBtn');if(toggleBtn)toggleBtn.innerHTML=isDark?'☀️ 切换主题':'🌙 切换主题';if(e){e.classList.add('theme-pulse');setTimeout(()=>e.classList.remove('theme-pulse'),350);}}function toggleTheme(){const cur=document.body.classList.contains('light');setTheme(cur);}let savedTheme=localStorage.getItem('xwtools_theme');const isDarkDefault=!window.matchMedia||window.matchMedia('(prefers-color-scheme: dark)').matches;const isDark=savedTheme? savedTheme==='dark': isDarkDefault;if(!isDark)document.body.classList.add('light');else document.body.classList.remove('light');setTheme(isDark);document.getElementById('themeToggleBtn').addEventListener('click',toggleTheme);function initDefault(){if(!b.value.trim())b.value='https://xwtools.cn';f();}initDefault();</script></body></html>
