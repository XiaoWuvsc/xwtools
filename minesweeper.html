<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes"><title>扫雷·经典版·xwtools</title><style>html,body{overflow-x:auto;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0!important;height:0!important;background:transparent!important;display:none!important}.board-wrapper,div,.container{scrollbar-width:none;-ms-overflow-style:none}.board-wrapper::-webkit-scrollbar,div::-webkit-scrollbar{display:none;width:0}*{margin:0;padding:0;box-sizing:border-box;user-select:none}:root{--bg-body:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);--card-bg:rgba(15,23,42,0.7);--text-primary:#e2e8f0;--text-secondary:#94a3b8;--border-color:rgba(71,85,105,0.5);--accent:#3b82f6;--shadow:0 25px 40px -12px rgba(0,0,0,0.4);--cell-bg:#334155;--cell-revealed:#1e293b;--cell-border:#475569;--btn-bg:rgba(59,130,246,0.2);--btn-hover:#3b82f6;--danger-bg:rgba(239,68,68,0.2);--danger-hover:#ef4444}[data-theme=light]{--bg-body:linear-gradient(135deg,#f1f5f9 0%,#e2e8f0 100%);--card-bg:rgba(255,255,255,0.85);--text-primary:#0f172a;--text-secondary:#334155;--border-color:rgba(0,0,0,0.1);--accent:#3b82f6;--cell-bg:#cbd5e1;--cell-revealed:#f1f5f9;--cell-border:#94a3b8;--btn-bg:rgba(59,130,246,0.1);--btn-hover:#2563eb;--danger-bg:rgba(239,68,68,0.1);--danger-hover:#dc2626}@keyframes bgSmoothFlash{0%{filter:brightness(.98)}50%{filter:brightness(1.02)}100%{filter:brightness(1)}}.bg-transition{animation:bgSmoothFlash .35s ease-out}.diff-animate{animation:diffFlash .2s ease-out}@keyframes diffFlash{0%{transform:scale(.98);opacity:.7}100%{transform:scale(1);opacity:1}}body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-body);color:var(--text-primary);min-height:100vh;padding:2rem 1rem;transition:background-color .4s ease,color .3s ease}.container{max-width:1200px;margin:0 auto;width:100%}.top-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card-bg);backdrop-filter:blur(16px);border-radius:2rem;padding:.6rem 1.2rem;margin-bottom:2rem;border:1px solid var(--border-color);transition:background .4s ease,border .3s ease}.nav-buttons{display:flex;gap:12px}.nav-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.15);padding:6px 14px;border-radius:40px;text-decoration:none;color:var(--text-secondary);font-size:.85rem;font-weight:500;border:1px solid var(--border-color);transition:all .2s;cursor:pointer}.nav-btn:hover{background:var(--accent);color:#fff;transform:translateY(-1px)}.game-card{background:var(--card-bg);backdrop-filter:blur(16px);border-radius:2rem;border:1px solid var(--border-color);padding:1.5rem;box-shadow:var(--shadow);text-align:center;transition:background .4s ease,border .3s ease,box-shadow .3s ease}.info-panel{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:1rem}.stats{display:flex;gap:1rem;background:var(--border-color);padding:.3rem 1rem;border-radius:2rem;font-family:monospace;transition:background .3s ease}.difficulty{display:flex;gap:.5rem}.difficulty button{background:rgba(59,130,246,.2);border:1px solid var(--border-color);padding:.2rem .8rem;border-radius:2rem;cursor:pointer;font-size:.8rem;color:var(--text-primary);transition:background .2s,color .2s,border .2s}.difficulty button.active{background:var(--accent);color:#fff}.reset-btn{background:var(--btn-bg);border:1px solid var(--border-color);padding:.3rem 1rem;border-radius:2rem;cursor:pointer;font-size:1.2rem;transition:background .2s,color .2s,border .2s}.reset-btn:hover{background:var(--btn-hover);color:#fff}.board-wrapper{overflow-x:auto;margin:1rem 0}.board-table{margin:0 auto;border-collapse:collapse;background:var(--cell-border);border-radius:.5rem;table-layout:fixed;transition:background .3s ease}.board-table td{width:32px;height:32px;background:var(--cell-bg);border:1px solid var(--cell-border);text-align:center;vertical-align:middle;font-weight:700;font-size:1rem;cursor:pointer;padding:0;touch-action:manipulation;transition:background .2s ease,border .2s ease,color .2s ease}.board-table td.revealed{background:var(--cell-revealed);cursor:default}.board-table td[data-value="1"]{color:#3b82f6}.board-table td[data-value="2"]{color:#10b981}.board-table td[data-value="3"]{color:#ef4444}.board-table td[data-value="4"]{color:#8b5cf6}.board-table td[data-value="5"]{color:#f59e0b}.board-table td[data-value="6"]{color:#06b6d4}.board-table td[data-value="7"]{color:#ec489a}.board-table td[data-value="8"]{color:#6b7280}@media(max-width:700px){.board-table td{width:28px;height:28px;font-size:.8rem}}@media(max-width:550px){.board-table td{width:24px;height:24px;font-size:.7rem}}.note{font-size:.7rem;color:var(--text-secondary);margin-top:1rem;transition:color .3s ease}</style></head><body><div class=container><div class=top-bar><div class=nav-buttons><a href=index.html class=nav-btn>← 返回工具箱</a><button id=themeToggleBtn class=nav-btn>🌙 切换主题</button></div></div><div class=game-card id=gameCard><div class=info-panel><div class=stats><span>💣 <span id=mineCount>0</span></span><span>⏱️ <span id=timerDisplay>0</span></span></div><div class=difficulty><button data-diff=easy class=active>简单</button><button data-diff=medium>中级</button><button data-diff=hard>高级</button></div><button id=resetBtn class=reset-btn>🔄</button></div><div class=board-wrapper><table id=boardTable class=board-table></table></div><div class=note>💡 左键/短按翻开 · 右键/长按标记旗子 · 数字表示周围雷数</div></div></div><script>(function(){let r=9,c=9,m=10,b=[],a=!0,f=!0,t=0,it=null,fc=0,d='easy',tb=document.getElementById('boardTable'),ms=document.getElementById('mineCount'),ts=document.getElementById('timerDisplay'),rb=document.getElementById('resetBtn'),dbs=document.querySelectorAll('.difficulty button'),gc=document.getElementById('gameCard'),ax=null;function au(){if(ax)return;try{ax=new(window.AudioContext||window.webkitAudioContext)();ax.resume();let g=ax.createGain();g.gain.value=0;g.connect(ax.destination);let o=ax.createOscillator();o.connect(g);o.start();o.stop(ax.currentTime+.01);ax.suspend().then(()=>ax.resume());}catch(e){}}function ex(){if(!ax){au();if(!ax)return;}ax.resume().then(()=>{let o=ax.createOscillator(),g=ax.createGain();o.connect(g);g.connect(ax.destination);o.frequency.value=260;g.gain.value=.6;o.start();g.gain.exponentialRampToValueAtTime(1e-5,ax.currentTime+.35);o.stop(ax.currentTime+.35);}).catch(e=>console.warn('音频播放失败'));}function ua(){au();if(ax&&ax.state==='suspended')ax.resume();document.removeEventListener('click',ua);document.removeEventListener('touchstart',ua);}document.addEventListener('click',ua);document.addEventListener('touchstart',ua);function sd(l){if(!a||f===!0){d=l;if(l==='easy'){r=9;c=9;m=10;}else if(l==='medium'){r=16;c=16;m=40;}else{r=16;c=30;m=99;}dbs.forEach(btn=>{btn.dataset.diff===l?btn.classList.add('active'):btn.classList.remove('active');});init();if(gc){gc.classList.add('diff-animate');setTimeout(()=>gc.classList.remove('diff-animate'),200);}}else{alert('游戏进行中，请先点击重置按钮');}}function init(){if(it)clearInterval(it);t=0;ts.innerText='0';a=!0;f=!0;fc=0;upd();b=[];for(let i=0;i<r;i++){b[i]=[];for(let j=0;j<c;j++)b[i][j]={mine:!1,revealed:!1,flag:!1,value:0};}ren();}function pl(fr,fc){let p=0;while(p<m){let i=Math.floor(Math.random()*r),j=Math.floor(Math.random()*c);if(i===fr&&j===fc)continue;if(!b[i][j].mine){b[i][j].mine=!0;p++;}}for(let i=0;i<r;i++)for(let j=0;j<c;j++){if(b[i][j].mine){b[i][j].value=-1;continue;}let cnt=0;for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){if(di===0&&dj===0)continue;let ni=i+di,nj=j+dj;if(ni>=0&&ni<r&&nj>=0&&nj<c&&b[ni][nj].mine)cnt++;}b[i][j].value=cnt;}}function rev(i,j){if(i<0||i>=r||j<0||j>=c)return;let cell=b[i][j];if(cell.revealed||cell.flag)return;cell.revealed=!0;if(cell.value===0){for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){if(di===0&&dj===0)continue;rev(i+di,j+dj);}}}function cw(){let ok=!0;for(let i=0;i<r;i++)for(let j=0;j<c;j++)if(!b[i][j].mine&&!b[i][j].revealed){ok=!1;break;}if(ok&&a){a=!1;it&&clearInterval(it);setTimeout(()=>alert('🎉 恭喜获胜！'),50);}}function lc(i,j){if(!a)return;let cell=b[i][j];if(cell.revealed||cell.flag)return;if(f){f=!1;pl(i,j);it=setInterval(()=>{if(a){t++;ts.innerText=t;}},1000);if(b[i][j].mine){b[i][j].mine=!1;for(let x=0;x<r;x++)for(let y=0;y<c;y++){if(b[x][y].mine)b[x][y].value=-1;else{let cnt=0;for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){if(di===0&&dj===0)continue;let ni=x+di,nj=y+dj;if(ni>=0&&ni<r&&nj>=0&&nj<c&&b[ni][nj].mine)cnt++;}b[x][y].value=cnt;}}}rev(i,j);ren();cw();return;}if(cell.mine){a=!1;it&&clearInterval(it);for(let x=0;x<r;x++)for(let y=0;y<c;y++)if(b[x][y].mine)b[x][y].revealed=!0;ren();ex();setTimeout(()=>alert('💥 踩雷了！游戏结束'),50);return;}rev(i,j);ren();cw();}function rc(e,i,j){e&&e.preventDefault();if(!a)return;let cell=b[i][j];if(cell.revealed)return;if(!cell.flag&&fc>=m)return;cell.flag=!cell.flag;fc+=cell.flag?1:-1;upd();ren();}function upd(){ms.innerText=Math.max(0,m-fc);}function ren(){tb.innerHTML='';let sz=window.innerWidth<=700?28:(window.innerWidth<=550?24:32),tw=c*sz;tb.style.width=tw+'px';for(let i=0;i<r;i++){let tr=document.createElement('tr');for(let j=0;j<c;j++){let cell=b[i][j],td=document.createElement('td');td.setAttribute('data-row',i);td.setAttribute('data-col',j);td.style.width=sz+'px';td.style.height=sz+'px';if(cell.revealed){td.classList.add('revealed');if(cell.mine)td.textContent='💣';else if(cell.value>0){td.textContent=cell.value;td.setAttribute('data-value',cell.value);}else td.textContent='';}else td.textContent=cell.flag?'🚩':'';tr.appendChild(td);}tb.appendChild(tr);}}function ra(){init();if(gc){gc.classList.add('diff-animate');setTimeout(()=>gc.classList.remove('diff-animate'),200);}}function hbc(e){let td=e.target.closest('td');if(!td)return;let row=parseInt(td.getAttribute('data-row')),col=parseInt(td.getAttribute('data-col'));if(isNaN(row)||isNaN(col))return;if(e.type==='click')lc(row,col);else if(e.type==='contextmenu'){e.preventDefault();rc(e,row,col);}}tb.addEventListener('click',hbc);tb.addEventListener('contextmenu',hbc);dbs.forEach(btn=>{btn.addEventListener('click',(e)=>{e.stopPropagation();sd(btn.dataset.diff);});});rb.addEventListener('click',(e)=>{e.stopPropagation();ra();});sd('easy');window.addEventListener('resize',()=>{if(b.length)ren();});function setTheme(th){document.documentElement.setAttribute('data-theme',th);localStorage.setItem('xwtools_theme',th);let btn=document.getElementById('themeToggleBtn');if(btn)btn.innerHTML=th==='dark'?'☀️ 切换主题':'🌙 切换主题';if(b.length)ren();let body=document.body;if(body){body.classList.add('bg-transition');setTimeout(()=>body.classList.remove('bg-transition'),400);}}function toggleTheme(){let cur=document.documentElement.getAttribute('data-theme')||'dark';setTheme(cur==='dark'?'light':'dark');}let saved=localStorage.getItem('xwtools_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');setTheme(saved);document.getElementById('themeToggleBtn').addEventListener('click',toggleTheme);})();</script></body></html>
